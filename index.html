<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ramo para Alba 🌸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="ramo">
            <div class="tallo t1"></div>
            <div class="tallo t2"></div>
            <div class="tallo t3"></div>

            <svg class="flor f1" viewBox="0 0 100 100" onclick="estallar(this, '#ff4d6d')">
                <g class="petalos-grp"></g>
                <circle cx="50" cy="50" r="10" class="centro"/>
            </svg>

            <svg class="flor f2" viewBox="0 0 100 100" onclick="estallar(this, '#ffdb58')">
                <g class="petalos-grp"></g>
                <circle cx="50" cy="50" r="10" class="centro"/>
            </svg>

            <svg class="flor f3" viewBox="0 0 100 100" onclick="estallar(this, '#9b5de5')">
                <g class="petalos-grp"></g>
                <circle cx="50" cy="50" r="10" class="centro"/>
            </svg>

            <div class="papel"></div>
        </div>

        <div class="mensaje"></div>
        <button class="replay" onclick="iniciarAnimacion()">Repetir Magia ✨</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
