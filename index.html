<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Alba 🌸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="ramo">
        <div class="envoltorio-papel"></div>

        <div class="tallo-container tc1">
            <div class="tallo"></div>
            <img src="images/flor-roja.png" alt="Flor Roja" class="flor-img">
            <div class="flor-centro-btn" data-color="#ff4d6d"></div> </div>

        <div class="tallo-container tc2">
            <div class="tallo"></div>
            <img src="images/flor-azul.png" alt="Flor Azul" class="flor-img">
            <div class="flor-centro-btn" data-color="#4caff0"></div> </div>

        <div class="tallo-container tc3">
            <div class="tallo"></div>
            <img src="images/flor-teal.png" alt="Flor Teal" class="flor-img">
            <div class="flor-centro-btn" data-color="#00f5d4"></div> </div>
    </div>

    <div class="mensaje">¡Un ramo especial para ti! 🌸</div>
    <button class="replay">Repetir Magia ✨</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
