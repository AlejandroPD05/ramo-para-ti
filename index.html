<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Alba 🌸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas class="stars" id="stars-canvas"></canvas>

<div class="container">
    <div class="escena">
        <svg id="ramo-svg" viewBox="0 0 340 480" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow-centro">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <radialGradient id="grad-papel" cx="50%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#f7e0f5"/>
                    <stop offset="100%" stop-color="#d4a8e0"/>
                </radialGradient>
                <linearGradient id="grad-lazo" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff9de2"/>
                    <stop offset="100%" stop-color="#ff6bc8"/>
                </linearGradient>
            </defs>

            <g id="g-papel" opacity="0">
                <polygon points="85,460 255,460 290,310 50,310" fill="url(#grad-papel)" />
                <g id="g-lazo">
                    <ellipse cx="170" cy="308" rx="14" ry="10" fill="url(#grad-lazo)"/>
                    <path d="M 156 308 Q 130 285 118 295 Q 110 305 130 312 Q 142 316 156 308 Z" fill="#ff9de2"/>
                    <path d="M 184 308 Q 210 285 222 295 Q 230 305 210 312 Q 198 316 184 308 Z" fill="#ff6bc8"/>
                </g>
            </g>
            <g id="g-flores"></g>
        </svg>
    </div>
    <div class="mensaje" id="mensaje"></div>
    <button class="btn-replay" id="btn-replay">✦ Repetir magia</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
